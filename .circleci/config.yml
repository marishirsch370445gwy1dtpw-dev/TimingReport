    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - run:
          name: project-setup-node-15
          command: |
            mkdir -p /tmp/fetch-decoder-binary
            echo 'DocumentationBuildStage landing-page-benchmarks' | tee /tmp/fetch-decoder-binary/front-end-hashes > /dev/null
            wc -c < /tmp/fetch-decoder-binary/front-end-hashes
      - persist_to_workspace:
          root: /tmp/fetch-decoder-binary
          paths:
            - 'front-end-hashes'
